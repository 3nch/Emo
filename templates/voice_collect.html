<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音情绪检测 - 心愈 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
        .pulse-ring {
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .wave-animate {
            animation: wave 1s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/'">
                <div class="w-10 h-10 bg-teal-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-teal-200">
                    <span class="text-xl">🌙</span>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-800">心愈 AI</span>
            </div>
            <div class="hidden md:flex items-center gap-10 text-sm font-medium text-gray-500">
                <a href="/" class="hover:text-teal-600 transition-colors">抑郁症检测</a>
                <a href="/soothe" class="hover:text-teal-600 transition-colors">情绪垃圾桶</a>
                <a href="/articles" class="hover:text-teal-600 transition-colors">心理科普</a>
                <a href="/community" class="hover:text-teal-600 transition-colors">互助社区</a>
                <a href="/profile" class="hover:text-teal-600 transition-colors">个人中心</a>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 pt-32 pb-16">
        <!-- 进度指示器 -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-slate-600">语音采集进度</span>
                <span class="text-sm font-medium text-teal-600" id="progress-text">模块 1 / 2</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2">
                <div id="progress-bar" class="bg-teal-600 h-2 rounded-full transition-all duration-300" style="width: 50%"></div>
            </div>
        </div>

        <!-- 模块1: 朗读句子 -->
        <div id="module1" class="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-slate-200/50">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-3xl">📖</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">模块一：朗读句子</h2>
                <p class="text-slate-500">请朗读屏幕上的句子，我们会分析您的语音特征</p>
            </div>

            <!-- 句子卡片 -->
            <div id="sentence-card" class="bg-gradient-to-br from-teal-50 to-white rounded-3xl p-8 mb-6 text-center">
                <p id="current-sentence" class="text-2xl font-medium text-slate-700 leading-relaxed">正在加载...</p>
            </div>

            <!-- 录音控制 -->
            <div class="flex flex-col items-center">
                <button id="record-btn-1" onclick="toggleRecording(1)" class="w-24 h-24 bg-red-500 hover:bg-red-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-red-200 transition-all hover:scale-105 mb-4">
                    <svg id="mic-icon-1" class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                    <svg id="stop-icon-1" class="w-10 h-10 hidden" fill="currentColor" viewBox="0 0 24 24">
                        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                    </svg>
                </button>
                <p id="record-status-1" class="text-slate-400 text-sm">点击麦克风开始录音</p>
                
                <!-- 音频波形可视化 -->
                <div id="waveform-1" class="flex items-center justify-center gap-1 h-12 mt-4 hidden">
                    <div class="w-1 bg-teal-400 rounded-full wave-animate" style="animation-delay: 0s;"></div>
                    <div class="w-1 bg-teal-400 rounded-full wave-animate" style="animation-delay: 0.1s;"></div>
                    <div class="w-1 bg-teal-400 rounded-full wave-animate" style="animation-delay: 0.2s;"></div>
                    <div class="w-1 bg-teal-400 rounded-full wave-animate" style="animation-delay: 0.3s;"></div>
                    <div class="w-1 bg-teal-400 rounded-full wave-animate" style="animation-delay: 0.4s;"></div>
                    <div class="w-1 bg-teal-400 rounded-full wave-animate" style="animation-delay: 0.5s;"></div>
                </div>
            </div>

            <!-- 导航按钮 -->
            <div class="flex justify-between mt-8">
                <button onclick="window.location.href='/'" class="px-6 py-3 text-slate-500 hover:text-slate-700 transition-colors">
                    跳过此模块
                </button>
                <button id="next-btn-1" onclick="goToModule2()" class="px-8 py-3 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition-all hidden">
                    进入下一模块 →
                </button>
            </div>
        </div>

        <!-- 模块2: 回答问题 -->
        <div id="module2" class="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-slate-200/50 hidden">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-3xl">🎤</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">模块二：回答问题</h2>
                <p class="text-slate-500">请回答以下问题，我们会分析您的语音情绪</p>
            </div>

            <!-- 问题卡片 -->
            <div class="bg-gradient-to-br from-purple-50 to-white rounded-3xl p-8 mb-6 text-center">
                <p id="current-question" class="text-2xl font-medium text-slate-700 leading-relaxed">正在加载...</p>
                <p id="question-hint" class="text-slate-400 text-sm mt-4">请自由发挥，无需紧张</p>
            </div>

            <!-- 录音控制 -->
            <div class="flex flex-col items-center">
                <button id="record-btn-2" onclick="toggleRecording(2)" class="w-24 h-24 bg-red-500 hover:bg-red-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-red-200 transition-all hover:scale-105 mb-4">
                    <svg id="mic-icon-2" class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                    </svg>
                    <svg id="stop-icon-2" class="w-10 h-10 hidden" fill="currentColor" viewBox="0 0 24 24">
                        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                    </svg>
                </button>
                <p id="record-status-2" class="text-slate-400 text-sm">点击麦克风开始录音</p>
                
                <!-- 音频波形可视化 -->
                <div id="waveform-2" class="flex items-center justify-center gap-1 h-12 mt-4 hidden">
                    <div class="w-1 bg-purple-400 rounded-full wave-animate" style="animation-delay: 0s;"></div>
                    <div class="w-1 bg-purple-400 rounded-full wave-animate" style="animation-delay: 0.1s;"></div>
                    <div class="w-1 bg-purple-400 rounded-full wave-animate" style="animation-delay: 0.2s;"></div>
                    <div class="w-1 bg-purple-400 rounded-full wave-animate" style="animation-delay: 0.3s;"></div>
                    <div class="w-1 bg-purple-400 rounded-full wave-animate" style="animation-delay: 0.4s;"></div>
                    <div class="w-1 bg-purple-400 rounded-full wave-animate" style="animation-delay: 0.5s;"></div>
                </div>
            </div>

            <!-- 导航按钮 -->
            <div class="flex justify-between mt-8">
                <button onclick="goToModule1()" class="px-6 py-3 text-slate-500 hover:text-slate-700 transition-colors">
                    ← 返回上一模块
                </button>
                <button id="submit-btn" onclick="submitVoiceData()" class="px-8 py-3 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 transition-all">
                    提交检测
                </button>
            </div>
        </div>

        <!-- 结果展示 -->
        <div id="result-section" class="bg-white rounded-[2.5rem] p-8 shadow-xl shadow-slate-200/50 hidden">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-gradient-to-br from-teal-400 to-purple-400 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-4xl">✨</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">语音情绪检测完成</h2>
                <p class="text-slate-500">以下是综合分析结果</p>
            </div>

            <!-- 结果卡片 -->
            <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="bg-slate-50 rounded-2xl p-4 text-center">
                    <p class="text-sm text-slate-400 mb-1">量表分数</p>
                    <p id="result-scale" class="text-3xl font-bold text-slate-700">--</p>
                </div>
                <div class="bg-slate-50 rounded-2xl p-4 text-center">
                    <p class="text-sm text-slate-400 mb-1">语音分析</p>
                    <p id="result-voice" class="text-3xl font-bold text-slate-700">--</p>
                </div>
                <div class="bg-slate-50 rounded-2xl p-4 text-center">
                    <p class="text-sm text-slate-400 mb-1">综合风险</p>
                    <p id="result-risk" class="text-3xl font-bold text-teal-600">--</p>
                </div>
            </div>

            <!-- 综合评估 -->
            <div id="result-assessment" class="bg-gradient-to-br from-teal-50 to-purple-50 rounded-3xl p-6 mb-6">
                <h3 class="font-bold text-slate-800 mb-2">综合评估</h3>
                <p id="assessment-text" class="text-slate-600 leading-relaxed">正在生成评估...</p>
            </div>

            <!-- 操作按钮 -->
            <div class="flex gap-4">
                <button onclick="window.location.href='/'" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">
                    返回首页
                </button>
                <button onclick="window.location.href='/detect'" class="flex-1 py-3 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition-all">
                    进行完整测评
                </button>
            </div>
        </div>
    </main>

    <!-- 全局错误处理与通知系统 -->
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>

    <script>
        // 状态变量
        let currentModule = 1;
        let sentences = [];
        let questions = [];
        let currentSentenceIndex = 0;
        let currentQuestionIndex = 0;
        let voiceResultsModule1 = [];
        let voiceResultsModule2 = [];
        
        // 录音状态
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingModule = null;
        let recordingStartTime = null;

        // 初始化
        async function init() {
            await loadSentences();
            await loadQuestions();
        }

        async function loadSentences() {
            try {
                const res = await fetch('/api/voice/sentences?count=5');
                sentences = await res.json();
                if (sentences.length > 0) {
                    document.getElementById('current-sentence').textContent = sentences[0].content;
                }
            } catch (e) {
                console.error('加载句子失败', e);
            }
        }

        async function loadQuestions() {
            try {
                const res = await fetch('/api/voice/questions');
                questions = await res.json();
                if (questions.length > 0) {
                    document.getElementById('current-question').textContent = questions[0].content;
                }
            } catch (e) {
                console.error('加载问题失败', e);
            }
        }

        function goToModule2() {
            currentModule = 2;
            document.getElementById('module1').classList.add('hidden');
            document.getElementById('module2').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('progress-text').textContent = '模块 2 / 2';
        }

        function goToModule1() {
            currentModule = 1;
            document.getElementById('module2').classList.add('hidden');
            document.getElementById('module1').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '50%';
            document.getElementById('progress-text').textContent = '模块 1 / 2';
        }

        async function toggleRecording(module) {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording(module);
            }
        }

        async function startRecording(module) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                recordingModule = module;
                recordingStartTime = Date.now();

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await uploadAudio(audioBlob, module);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                updateRecordingUI(module, true);
            } catch (e) {
                notificationSystem.error('无法访问麦克风，请检查权限设置');
                console.error('录音错误', e);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                updateRecordingUI(recordingModule, false);
            }
        }

        function updateRecordingUI(module, recording) {
            const recordBtn = document.getElementById(`record-btn-${module}`);
            const micIcon = document.getElementById(`mic-icon-${module}`);
            const stopIcon = document.getElementById(`stop-icon-${module}`);
            const status = document.getElementById(`record-status-${module}`);
            const waveform = document.getElementById(`waveform-${module}`);

            if (recording) {
                recordBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
                recordBtn.classList.add('bg-red-600', 'pulse-ring');
                micIcon.classList.add('hidden');
                stopIcon.classList.remove('hidden');
                status.textContent = '正在录音... 点击停止';
                waveform.classList.remove('hidden');
            } else {
                recordBtn.classList.add('bg-red-500', 'hover:bg-red-600');
                recordBtn.classList.remove('bg-red-600', 'pulse-ring');
                micIcon.classList.remove('hidden');
                stopIcon.classList.add('hidden');
                waveform.classList.add('hidden');
            }
        }

        async function uploadAudio(blob, module) {
            const duration = Math.round((Date.now() - recordingStartTime) / 1000);
            const formData = new FormData();
            formData.append('file', blob, 'recording.webm');
            formData.append('module_type', module === 1 ? 'reading' : 'qa');
            formData.append('duration', duration);

            try {
                const res = await fetch('/api/voice/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    const result = data.result;
                    
                    if (module === 1) {
                        voiceResultsModule1.push(result);
                        // 显示下一句
                        if (currentSentenceIndex < sentences.length - 1) {
                            currentSentenceIndex++;
                            document.getElementById('current-sentence').textContent = sentences[currentSentenceIndex].content;
                            notificationSystem.success('已保存，继续朗读下一句');
                        } else {
                            document.getElementById('next-btn-1').classList.remove('hidden');
                            notificationSystem.success('模块一完成！');
                        }
                    } else {
                        voiceResultsModule2.push(result);
                        // 显示下一问题
                        if (currentQuestionIndex < questions.length - 1) {
                            currentQuestionIndex++;
                            document.getElementById('current-question').textContent = questions[currentQuestionIndex].content;
                            notificationSystem.success('已保存，继续回答下一题');
                        }
                    }
                } else {
                    notificationSystem.error(data.error || '上传失败');
                }
            } catch (e) {
                notificationSystem.error('网络错误，上传失败');
                console.error('上传错误', e);
            }
        }

        async function submitVoiceData() {
            try {
                const res = await fetch('/api/voice/result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        scale_score: 10, // 默认值，实际应从量表获取
                        voice_results: [...voiceResultsModule1, ...voiceResultsModule2]
                    })
                });
                const data = await res.json();

                if (data.final_score !== undefined) {
                    showResults(data);
                } else {
                    notificationSystem.error(data.error || '提交失败');
                }
            } catch (e) {
                notificationSystem.error('网络错误');
                console.error('提交错误', e);
            }
        }

        function showResults(data) {
            document.getElementById('module2').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('progress-text').textContent = '检测完成';

            document.getElementById('result-scale').textContent = data.scale_score;
            document.getElementById('result-voice').textContent = data.voice_score;
            document.getElementById('result-risk').textContent = data.risk_level;

            // 生成评估文本
            let assessment = '';
            if (data.risk_level === '低') {
                assessment = '您的整体情绪状态较为稳定，语音特征显示您能够较为平和地表达自己。建议继续保持良好的生活习惯，适度运动，保持社交活动。';
            } else if (data.risk_level === '中') {
                assessment = '您的语音分析显示可能存在一定的情绪波动。建议您多关注自己的情绪变化，可以尝试正念冥想、深呼吸等放松技巧。如果感到不适，请寻求专业帮助。';
            } else {
                assessment = '您的语音特征显示可能存在较大的情绪压力。建议您尽快寻求专业心理咨询师的帮助。您也可以拨打心理援助热线：400-161-9995。';
            }
            document.getElementById('assessment-text').textContent = assessment;
        }

        // 页面加载
        init();
    </script>
</body>
</html>
