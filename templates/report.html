<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评估报告 - 心愈 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body class="bg-white py-16 px-6">

    <nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/'">
                <div class="w-10 h-10 bg-teal-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-teal-200">
                    <span class="text-xl">🌙</span>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-800">心愈 AI</span>
            </div>
            <div class="hidden md:flex items-center gap-10 text-sm font-medium text-gray-500">
                <a href="/" class="hover:text-teal-600 transition-colors">抑郁症检测</a>
                <a href="/soothe" class="hover:text-teal-600 transition-colors">情绪垃圾桶</a>
                <a href="/articles" class="hover:text-teal-600 transition-colors">心理科普</a>
                <a href="/community" class="hover:text-teal-600 transition-colors">互助社区</a>
                <a href="/profile" class="hover:text-teal-600 transition-colors">个人中心</a>
            </div>
            <div onclick="window.location.href='/profile'" class="w-9 h-9 rounded-full bg-teal-100 border border-teal-200 overflow-hidden cursor-pointer hover:ring-2 ring-teal-500 transition-all">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed={{ session.username }}" alt="avatar">
            </div>
        </div>
    </nav>

    <div class="pt-24"></div>

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-12">
        <div id="main" class="w-full h-[500px] flex-1"></div>

        <div class="flex-1 space-y-6">
            <div class="flex items-center gap-2">
                <span class="w-8 h-1 bg-teal-600 rounded-full"></span>
                <span class="text-teal-600 font-bold text-sm tracking-widest uppercase">Assessment Report</span>
            </div>
            
            <h1 class="text-4xl font-bold text-slate-900 leading-tight">
                检测结论: <span id="risk-text" class="text-teal-600">计算中...</span>
            </h1>

            <p class="text-gray-500 leading-relaxed text-lg">
                基于 <b>PHQ-9 抑郁</b>、<b>GAD-7 焦虑</b>、<b>睡眠质量</b>、<b>压力感知</b>、<b>社交压力</b>及<b>自我认同</b>六大维度的交叉分析，结合 <b>AI 语音情绪识别</b> 算法，我们为您生成了这份全方位的心理画像。
            </p>

            <div class="grid grid-cols-2 gap-4 my-6">
                <div class="p-4 bg-slate-50 rounded-2xl border-b-2 border-teal-100">
                    <p class="text-xs text-slate-400 mb-1">主要压力源</p>
                    <p id="top-stressor" class="font-bold text-slate-700">数据分析中...</p>
                </div>
                <div class="p-4 bg-slate-50 rounded-2xl border-b-2 border-teal-100">
                    <p class="text-xs text-slate-400 mb-1">语音情绪信心值</p>
                    <p id="voice-conf" class="font-bold text-slate-700">实时匹配中</p>
                </div>
            </div>

            <div class="p-6 bg-teal-50/50 rounded-3xl border-l-4 border-teal-600 text-slate-600 italic">
                “您的每一个细微情绪，都值得被温柔对待。如果您感到疲惫，可以前往情绪垃圾桶进行语音倾诉。”
            </div>

            <div class="flex gap-4">
                <button onclick="window.location.href='/soothe'" class="flex-1 bg-teal-700 text-white px-8 py-4 rounded-2xl font-bold shadow-xl shadow-teal-100 hover:bg-teal-800 transition-all active:scale-95">
                    前往情绪垃圾桶
                </button>
                <button onclick="window.location.href='/detect'" class="px-8 py-4 rounded-2xl font-bold text-teal-700 border-2 border-teal-100 hover:bg-teal-50 transition-all">
                    重新测试
                </button>
            </div>
        </div>
    </div>

    <!-- 推荐文章模块 -->
    <div class="max-w-6xl mx-auto mt-16 px-6">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-12 h-12 bg-gradient-to-br from-teal-500 to-emerald-500 rounded-2xl flex items-center justify-center shadow-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-slate-800">推荐阅读</h2>
                <p class="text-slate-500 text-sm">根据您的测评结果，为您推荐以下文章</p>
            </div>
        </div>

        <div id="recommended-articles" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="col-span-full flex justify-center py-8">
                <div class="animate-pulse text-slate-400">正在加载推荐文章...</div>
            </div>
        </div>
    </div>

    <script>
        // 分类名称映射
        const categoryNames = {
            'Depression': '抑郁',
            'Anxiety': '焦虑',
            'Sleep': '睡眠',
            'Pressure': '压力',
            'Social': '社交',
            'Self': '自我成长'
        };

        const categoryColors = {
            'Depression': 'bg-purple-50 text-purple-600',
            'Anxiety': 'bg-blue-50 text-blue-600',
            'Sleep': 'bg-indigo-50 text-indigo-600',
            'Pressure': 'bg-orange-50 text-orange-600',
            'Social': 'bg-green-50 text-green-600',
            'Self': 'bg-pink-50 text-pink-600'
        };

        // 1. 获取后端传回的数据
        // 期望格式: {radar_data: [dep, anx, sle, pre, soc, self, voice], risk_level: '...'}
        const data = JSON.parse(localStorage.getItem('eval_result')) || {
            radar_data: [5, 5, 5, 5, 5, 5, 5], 
            risk_level: '数据读取失败'
        };

        document.getElementById('risk-text').innerText = data.risk_level;

        // 简易逻辑：找出得分最高的维度（除语音外）作为压力源
        const indicators_names = ['抑郁倾向', '焦虑水平', '睡眠质量', '压力感知', '社交压力', '自我认同'];
        const scores_only = data.radar_data.slice(0, 6);
        const maxIndex = scores_only.indexOf(Math.max(...scores_only));
        document.getElementById('top-stressor').innerText = indicators_names[maxIndex];

        // 2. 初始化 ECharts
        const chart = echarts.init(document.getElementById('main'));
        
        const option = {
            color: ['#2D9596'],
            tooltip: { show: true },
            radar: {
                indicator: [
                    { name: '抑郁指征', max: 10 },
                    { name: '焦虑水平', max: 10 },
                    { name: '睡眠指数', max: 10 },
                    { name: '压力感知', max: 10 },
                    { name: '社交压力', max: 10 },
                    { name: '自我认同', max: 10 },
                    { name: '语音情绪', max: 10 }
                ],
                shape: 'circle',
                radius: '65%',
                axisName: {
                    color: '#64748b',
                    fontSize: 12,
                    fontWeight: 'bold',
                    padding: [3, 10]
                },
                splitLine: {
                    lineStyle: {
                        color: ['rgba(45,149,150,0.2)', 'rgba(45,149,150,0.1)'],
                        width: 1
                    }
                },
                splitArea: { show: false },
                axisLine: {
                    lineStyle: { color: 'rgba(45,149,150,0.1)' }
                }
            },
            series: [{
                type: 'radar',
                data: [{
                    value: data.radar_data,
                    name: '心理特征分布',
                    symbol: 'circle',
                    symbolSize: 6,
                    areaStyle: {
                        color: new echarts.graphic.RadialGradient(0.5, 0.5, 1, [
                            { color: 'rgba(45, 149, 150, 0.6)', offset: 0 },
                            { color: 'rgba(45, 149, 150, 0.1)', offset: 1 }
                        ])
                    },
                    lineStyle: { width: 4, color: '#2D9596' },
                    itemStyle: { color: '#2D9596', borderWidth: 2, borderColor: '#fff' }
                }]
            }]
        };

        chart.setOption(option);

        // 窗口缩放自适应
        window.onresize = chart.resize;

        // 加载推荐文章
        async function loadRecommendedArticles() {
            try {
                const highestCategory = data.highest_category || '';
                const res = await fetch(`/api/articles/recommend?category=${highestCategory}&limit=3`);
                const articles = await res.json();
                renderRecommendedArticles(articles);
            } catch (e) {
                document.getElementById('recommended-articles').innerHTML =
                    `<div class="col-span-full text-center py-8 text-slate-400">暂无推荐</div>`;
            }
        }

        function renderRecommendedArticles(articles) {
            const container = document.getElementById('recommended-articles');
            if (!articles || articles.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">暂无推荐</div>`;
                return;
            }

            container.innerHTML = articles.map(a => `
                <div onclick="window.location.href='/article/${a.id}'"
                     class="bg-white rounded-[2rem] p-6 shadow-sm hover:shadow-xl transition-all cursor-pointer border border-transparent hover:border-teal-100 group">
                    <span class="inline-block px-3 py-1 rounded-full text-xs font-medium ${categoryColors[a.category] || 'bg-slate-100 text-slate-600'}">
                        ${categoryNames[a.category] || '科普'}
                    </span>
                    <h3 class="text-lg font-bold text-slate-800 mt-4 mb-3 group-hover:text-teal-600 transition-colors">${a.title}</h3>
                    <p class="text-sm text-slate-500 line-clamp-2">${a.summary || '点击查看全文'}</p>
                    <div class="mt-4 flex items-center text-teal-600 text-sm font-medium">
                        阅读全文
                        <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </div>
                </div>
            `).join('');
        }

        // 页面加载后获取推荐文章
        window.onload = function() {
            loadRecommendedArticles();
        };
    </script>
</body>
</html>
