<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 心愈 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
        .hero-gradient { background: radial-gradient(circle at 70% 30%, #f0fdfa 0%, #ffffff 100%); }
    </style>
</head>
<body class="bg-white text-slate-800 hero-gradient min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">
        <div class="flex items-center justify-center gap-2 mb-8 cursor-pointer" onclick="window.location.href='/'">
            <div class="w-12 h-12 bg-teal-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-teal-200">
                <span class="text-2xl">🌙</span>
            </div>
            <span class="text-2xl font-bold tracking-tight text-slate-800">心愈 AI</span>
        </div>

        <div class="bg-white/80 backdrop-blur-xl rounded-[2.5rem] p-10 shadow-2xl border border-white">
            <h1 class="text-3xl font-bold text-slate-900 mb-2 text-center">欢迎回来</h1>
            <p class="text-slate-500 text-center mb-8">开启您的心灵愈合之旅</p>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-6 text-center font-medium">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/login" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">用户名</label>
                    <input type="text" name="username" required 
                        class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-teal-500 focus:bg-white transition-all outline-none"
                        placeholder="请输入您的用户名">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">密码</label>
                    <input type="password" name="password" required 
                        class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-teal-500 focus:bg-white transition-all outline-none"
                        placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-teal-100 hover:-translate-y-1">
                    立即登录
                </button>
            </form>

            <p class="text-center mt-8 text-slate-500 text-sm">
                还没有账号？
                <a href="/register" class="text-teal-600 font-bold hover:underline">立即注册</a>
            </p>
        </div>
    </div>

    <!-- 全局错误处理与通知系统 -->
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>

    <script>
        // 登录成功后的回调处理
        {% if session.get('user_id') %}
        // 保存用户ID到sessionStorage，用于通知系统
        sessionStorage.setItem('user_id', '{{ session.get("user_id") }}');
        // 显示欢迎回来提示
        setTimeout(() => {
            notificationSystem.success('欢迎回来，{{ session.get("username") }}！');
        }, 500);
        {% endif %}

        // 检查是否有登录成功跳转回来的参数
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('login_success') === 'true') {
            sessionStorage.setItem('user_id', urlParams.get('user_id') || '{{ session.get("user_id") }}');
        }
    </script>
</body>
</html>
