<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title }} - 心愈 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-teal-50 min-h-screen flex items-center justify-center">

    <div class="max-w-lg mx-auto px-6 text-center">
        <!-- 错误图标 -->
        <div class="mb-8">
            {% if error_code == 404 %}
            <div class="w-32 h-32 mx-auto bg-teal-100 rounded-full flex items-center justify-center">
                <svg class="w-16 h-16 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            {% elif error_code == 500 %}
            <div class="w-32 h-32 mx-auto bg-red-100 rounded-full flex items-center justify-center">
                <svg class="w-16 h-16 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            {% elif error_code == 403 %}
            <div class="w-32 h-32 mx-auto bg-orange-100 rounded-full flex items-center justify-center">
                <svg class="w-16 h-16 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            {% elif error_code == 429 %}
            <div class="w-32 h-32 mx-auto bg-yellow-100 rounded-full flex items-center justify-center">
                <svg class="w-16 h-16 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            {% else %}
            <div class="w-32 h-32 mx-auto bg-slate-100 rounded-full flex items-center justify-center">
                <svg class="w-16 h-16 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            {% endif %}
        </div>

        <!-- 错误代码 -->
        <div class="text-7xl font-bold text-slate-200 mb-4">{{ error_code }}</div>

        <!-- 错误标题 -->
        <h1 class="text-3xl font-bold text-slate-800 mb-4">{{ error_title }}</h1>

        <!-- 错误描述 -->
        <p class="text-slate-500 mb-8 leading-relaxed">{{ error_message }}</p>

        <!-- 建议操作 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <h3 class="font-bold text-slate-700 mb-4">您可以：</h3>
            <ul class="text-left text-slate-500 space-y-3">
                <li class="flex items-start gap-3">
                    <svg class="w-5 h-5 text-teal-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>返回上一页并刷新</span>
                </li>
                <li class="flex items-start gap-3">
                    <svg class="w-5 h-5 text-teal-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>点击导航栏访问其他页面</span>
                </li>
                <li class="flex items-start gap-3">
                    <svg class="w-5 h-5 text-teal-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>如有问题，请联系技术支持</span>
                </li>
            </ul>
        </div>

        <!-- 按钮 -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button onclick="history.back()" class="px-8 py-3 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 transition-all shadow-lg shadow-teal-200">
                返回上一页
            </button>
            <a href="/" class="px-8 py-3 bg-white text-slate-600 rounded-xl font-bold hover:bg-slate-50 transition-all border border-slate-200">
                回到首页
            </a>
        </div>

        <!-- 底部信息 -->
        <div class="mt-12 text-sm text-slate-400">
            <p>错误代码: {{ error_code }} | 心愈 AI 心理健康评估系统</p>
        </div>
    </div>

</body>
</html>
