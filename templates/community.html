<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区互助 - 心愈 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans SC', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/'">
                <div class="w-10 h-10 bg-teal-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-teal-200">
                    <span class="text-xl">🌙</span>
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-800">心愈 AI</span>
            </div>
            <div class="hidden md:flex items-center gap-10 text-sm font-medium text-gray-500">
                <a href="/" class="hover:text-teal-600 transition-colors">抑郁症检测</a>
                <a href="/soothe" class="hover:text-teal-600 transition-colors">情绪垃圾桶</a>
                <a href="/articles" class="hover:text-teal-600 transition-colors">心理科普</a>
                <a href="/community" class="text-teal-600 font-bold border-b-2 border-teal-600 pb-1">互助社区</a>
                <a href="/profile" class="hover:text-teal-600 transition-colors">个人中心</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 pt-32 pb-16">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">互助社区</h1>
            <p class="text-slate-500">在这里，你可以分享心情，互相支持</p>
        </div>

        <!-- 发布帖子 -->
        <div class="bg-white rounded-[2.5rem] p-8 shadow-lg shadow-slate-200/50 mb-8">
            <textarea id="post-content" placeholder="今天有什么想分享的吗？" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-slate-700 placeholder:text-slate-300 focus:ring-2 focus:ring-teal-500 outline-none" rows="3"></textarea>
            
            <div class="flex items-center justify-between mt-4">
                <div class="flex gap-2">
                    <button onclick="selectMood('开心')" class="mood-btn px-3 py-1 rounded-full bg-yellow-50 text-yellow-600 text-sm hover:bg-yellow-100" data-mood="开心">开心</button>
                    <button onclick="selectMood('难过')" class="mood-btn px-3 py-1 rounded-full bg-blue-50 text-blue-600 text-sm hover:bg-blue-100" data-mood="难过">难过</button>
                    <button onclick="selectMood('焦虑')" class="mood-btn px-3 py-1 rounded-full bg-purple-50 text-purple-600 text-sm hover:bg-purple-100" data-mood="焦虑">焦虑</button>
                    <button onclick="selectMood('平静')" class="mood-btn px-3 py-1 rounded-full bg-green-50 text-green-600 text-sm hover:bg-green-100" data-mood="平静">平静</button>
                    <button onclick="selectMood('感恩')" class="mood-btn px-3 py-1 rounded-full bg-pink-50 text-pink-600 text-sm hover:bg-pink-100" data-mood="感恩">感恩</button>
                </div>
                <button onclick="submitPost()" class="bg-teal-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-teal-700 transition-all">发布</button>
            </div>
        </div>

        <!-- 帖子列表 -->
        <div id="posts-list" class="space-y-6">
            <div class="text-center py-10 text-slate-400">正在加载...</div>
        </div>

        <!-- 分页控件 -->
        <div id="pagination-container" class="mt-8 flex justify-center items-center gap-2">
        </div>
    </main>

    <script>
        let selectedMood = '';
        let currentPage = 1;
        let paginationData = null;
        const PAGE_SIZE = 10;

        function selectMood(mood) {
            selectedMood = mood;
            document.querySelectorAll('.mood-btn').forEach(btn => {
                if (btn.dataset.mood === mood) {
                    btn.classList.add('ring-2', 'ring-teal-500');
                } else {
                    btn.classList.remove('ring-2', 'ring-teal-500');
                }
            });
        }

        async function submitPost() {
            const content = document.getElementById('post-content').value.trim();
            if (!content) {
                notificationSystem.warning('请输入内容');
                return;
            }

            try {
                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: content, mood_tag: selectedMood})
                });

                if (res.status === 401) {
                    notificationSystem.warning('请先登录');
                    return;
                }

                if (!res.ok) {
                    const data = await res.json();
                    notificationSystem.error(data.error || '发布失败');
                    return;
                }

                document.getElementById('post-content').value = '';
                selectedMood = '';
                document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('ring-2', 'ring-teal-500'));
                notificationSystem.success('发布成功！');
                // 发布成功后刷新列表，并回到第一页
                currentPage = 1;
                loadPosts();
            } catch (e) {
                notificationSystem.error('网络错误，请检查网络连接');
            }
        }

        async function loadPosts(page = 1) {
            try {
                const res = await fetch(`/api/posts?page=${page}&page_size=${PAGE_SIZE}`);
                const data = await res.json();

                // 处理分页响应格式
                let posts, pagination;
                if (Array.isArray(data)) {
                    // 兼容旧格式（无分页数据）
                    posts = data;
                    pagination = null;
                } else {
                    posts = data.posts || [];
                    pagination = data.pagination || null;
                }

                paginationData = pagination;
                currentPage = page;

                const container = document.getElementById('posts-list');

                if (posts.length === 0) {
                    container.innerHTML = '<div class="text-center py-10 text-slate-400">暂无帖子，快来发布第一条吧！</div>';
                    renderPagination(null);
                    return;
                }

                const moodColors = {
                    '开心': 'bg-yellow-50 text-yellow-600',
                    '难过': 'bg-blue-50 text-blue-600',
                    '焦虑': 'bg-purple-50 text-purple-600',
                    '平静': 'bg-green-50 text-green-600',
                    '感恩': 'bg-pink-50 text-pink-600'
                };

                container.innerHTML = posts.map(p => `
                    <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-teal-100 flex items-center justify-center text-teal-600 font-bold">
                                    ${p.anonymous_name ? p.anonymous_name.charAt(0) : '匿名'}
                                </div>
                                <div>
                                    <p class="font-bold text-slate-700">${p.anonymous_name || '匿名用户'}</p>
                                    <p class="text-xs text-slate-400">${new Date(p.created_at).toLocaleString('zh-CN')}</p>
                                </div>
                            </div>
                            ${p.mood_tag ? `<span class="px-3 py-1 rounded-full text-xs font-medium ${moodColors[p.mood_tag] || 'bg-slate-100 text-slate-600'}">${p.mood_tag}</span>` : ''}
                        </div>
                        <p class="text-slate-600 mb-4 whitespace-pre-line">${p.content}</p>
                        <div class="flex items-center gap-4">
                            <button onclick="toggleLike(${p.id})" class="flex items-center gap-1 text-sm ${p.liked ? 'text-red-500' : 'text-slate-400 hover:text-red-500'}">
                                <svg class="w-5 h-5" fill="${p.liked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                                <span id="likes-${p.id}">${p.like_count || 0}</span>
                            </button>
                            <button onclick="toggleComments(${p.id})" class="flex items-center gap-1 text-sm text-slate-400 hover:text-teal-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                <span id="comments-count-${p.id}">${p.comment_count || 0}</span>
                            </button>
                        </div>
                        <!-- 评论区 -->
                        <div id="comments-section-${p.id}" class="mt-4 hidden">
                            <div id="comments-list-${p.id}" class="space-y-3 mb-4"></div>
                            <div class="flex gap-2">
                                <input type="text" id="comment-input-${p.id}" placeholder="写下你的评论..." class="flex-1 bg-slate-50 border-none rounded-xl px-4 py-2 text-sm text-slate-600 placeholder:text-slate-300 focus:ring-2 focus:ring-teal-500 outline-none" onkeypress="if(event.key==='Enter') addComment(${p.id})">
                                <button onclick="addComment(${p.id})" class="bg-teal-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-teal-700 transition-all">发送</button>
                            </div>
                        </div>
                    </div>
                `).join('');

                // 渲染分页控件
                renderPagination(pagination);

            } catch (e) {
                document.getElementById('posts-list').innerHTML = '<div class="text-center py-10 text-red-400">加载失败</div>';
            }
        }

        function renderPagination(pagination) {
            const container = document.getElementById('pagination-container');

            if (!pagination || pagination.total_pages <= 1) {
                container.innerHTML = '';
                return;
            }

            const { page, total_pages, has_next, has_prev, total_count } = pagination;
            let html = '';

            // 上一页
            if (has_prev) {
                html += `<button onclick="loadPosts(${page - 1})" class="px-4 py-2 rounded-xl bg-white text-slate-600 hover:bg-teal-50 transition-colors border border-slate-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>`;
            } else {
                html += `<button disabled class="px-4 py-2 rounded-xl bg-slate-100 text-slate-300 cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>`;
            }

            // 页码
            const maxVisiblePages = 5;
            let startPage = Math.max(1, page - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(total_pages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            // 第一页
            if (startPage > 1) {
                html += `<button onclick="loadPosts(1)" class="px-4 py-2 rounded-xl bg-white text-slate-600 hover:bg-teal-50 transition-colors border border-slate-200">1</button>`;
                if (startPage > 2) {
                    html += `<span class="px-2 text-slate-400">...</span>`;
                }
            }

            // 中间页码
            for (let i = startPage; i <= endPage; i++) {
                if (i === page) {
                    html += `<button class="px-4 py-2 rounded-xl bg-teal-600 text-white font-bold">${i}</button>`;
                } else {
                    html += `<button onclick="loadPosts(${i})" class="px-4 py-2 rounded-xl bg-white text-slate-600 hover:bg-teal-50 transition-colors border border-slate-200">${i}</button>`;
                }
            }

            // 最后一页
            if (endPage < total_pages) {
                if (endPage < total_pages - 1) {
                    html += `<span class="px-2 text-slate-400">...</span>`;
                }
                html += `<button onclick="loadPosts(${total_pages})" class="px-4 py-2 rounded-xl bg-white text-slate-600 hover:bg-teal-50 transition-colors border border-slate-200">${total_pages}</button>`;
            }

            // 下一页
            if (has_next) {
                html += `<button onclick="loadPosts(${page + 1})" class="px-4 py-2 rounded-xl bg-white text-slate-600 hover:bg-teal-50 transition-colors border border-slate-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>`;
            } else {
                html += `<button disabled class="px-4 py-2 rounded-xl bg-slate-100 text-slate-300 cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>`;
            }

            // 总数信息
            html += `<span class="ml-4 text-sm text-slate-400">共 ${total_count} 条帖子</span>`;

            container.innerHTML = html;
        }

        async function toggleLike(postId) {
            try {
                const res = await fetch(`/api/posts/${postId}/like`, {method: 'POST'});
                const data = await res.json();

                if (res.status === 401) {
                    notificationSystem.warning('请先登录');
                    return;
                }

                if (!res.ok) {
                    notificationSystem.error(data.error || '操作失败');
                    return;
                }

                document.getElementById(`likes-${postId}`).innerText = data.likes;
                loadPosts(currentPage);
            } catch (e) {
                notificationSystem.error('网络错误，请检查网络连接');
            }
        }

        async function toggleComments(postId) {
            const section = document.getElementById(`comments-section-${postId}`);
            if (section.classList.contains('hidden')) {
                section.classList.remove('hidden');
                await loadComments(postId);
            } else {
                section.classList.add('hidden');
            }
        }

        async function loadComments(postId) {
            try {
                const res = await fetch(`/api/posts/${postId}/comments`);
                const comments = await res.json();

                const listContainer = document.getElementById(`comments-list-${postId}`);
                
                if (comments.length === 0) {
                    listContainer.innerHTML = '<div class="text-center py-4 text-slate-400 text-sm">暂无评论，快来抢沙发吧！</div>';
                    return;
                }

                listContainer.innerHTML = comments.map(c => `
                    <div class="flex gap-3 p-3 bg-slate-50 rounded-xl">
                        <div class="w-8 h-8 rounded-full bg-teal-100 flex items-center justify-center text-teal-600 text-xs font-bold flex-shrink-0">
                            ${c.anonymous_name ? c.anonymous_name.charAt(0) : '匿'}
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-sm text-slate-700">${c.anonymous_name || '匿名用户'}</span>
                                <span class="text-xs text-slate-400">${new Date(c.created_at).toLocaleString('zh-CN')}</span>
                            </div>
                            <p class="text-sm text-slate-600 mt-1">${escapeHtml(c.content)}</p>
                        </div>
                        ${c.user_id == sessionStorage.getItem('user_id') ? `
                            <button onclick="deleteComment(${c.id}, ${postId})" class="text-xs text-slate-400 hover:text-red-500">删除</button>
                        ` : ''}
                    </div>
                `).join('');
            } catch (e) {
                console.error('加载评论失败', e);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const content = input.value.trim();

            if (!content) {
                notificationSystem.warning('请输入评论内容');
                return;
            }

            try {
                const res = await fetch(`/api/posts/${postId}/comments`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content})
                });

                const data = await res.json();

                if (res.status === 401) {
                    notificationSystem.warning('请先登录');
                    return;
                }

                if (!res.ok) {
                    notificationSystem.error(data.error || '评论失败');
                    return;
                }

                input.value = '';
                await loadComments(postId);
                
                // 更新评论数
                const countSpan = document.getElementById(`comments-count-${postId}`);
                const currentCount = parseInt(countSpan.innerText) || 0;
                countSpan.innerText = currentCount + 1;
                
                notificationSystem.success('评论成功');
            } catch (e) {
                notificationSystem.error('网络错误，请检查网络连接');
            }
        }

        async function deleteComment(commentId, postId) {
            if (!confirm('确定要删除这条评论吗？')) return;

            try {
                const res = await fetch(`/api/comments/${commentId}`, {method: 'DELETE'});
                const data = await res.json();

                if (!res.ok) {
                    notificationSystem.error(data.error || '删除失败');
                    return;
                }

                await loadComments(postId);
                
                // 更新评论数
                const countSpan = document.getElementById(`comments-count-${postId}`);
                const currentCount = parseInt(countSpan.innerText) || 0;
                countSpan.innerText = Math.max(0, currentCount - 1);
                
                notificationSystem.success('删除成功');
            } catch (e) {
                notificationSystem.error('网络错误，请检查网络连接');
            }
        }

        window.onload = () => loadPosts(1);
    </script>

    <!-- 全局错误处理与通知系统 -->
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>

    <script>
        // 用户登录后保存用户ID到sessionStorage
        {% if session.get('user_id') %}
        sessionStorage.setItem('user_id', '{{ session.get("user_id") }}');
        {% endif %}
    </script>
</body>
</html>
