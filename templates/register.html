<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>注册 — 心愈 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
body{background:#F8F9FB;}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
</style>
</head>
<body>
<div class="wrap">
  <div style="width:100%;max-width:400px;">

    <a href="/" style="display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:28px;text-decoration:none;">
      <div style="width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#31572c,#4f772d);display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(49,87,44,0.28);">🌿</div>
      <span style="font-size:15px;font-weight:700;color:var(--text-1);letter-spacing:-.02em;">心愈 AI</span>
    </a>

    <div style="background:#fff;border:1px solid var(--border);border-radius:var(--r-xl);padding:36px 32px;box-shadow:var(--shadow-lg);">

      <div style="text-align:center;margin-bottom:28px;">
        <h1 style="font-size:20px;font-weight:800;color:var(--text-1);margin-bottom:5px;letter-spacing:-.03em;">创建账号</h1>
        <p style="font-size:13px;color:var(--text-3);">加入我们，开始关注您的心理健康</p>
      </div>

      {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}
      <div style="background:var(--c-red-bg);border:1px solid rgba(239,68,68,0.2);color:var(--c-red);padding:10px 13px;border-radius:var(--r-md);font-size:13px;text-align:center;margin-bottom:16px;">{{ m }}</div>
      {% endfor %}{% endif %}{% endwith %}

      <form action="/register" method="POST" style="display:flex;flex-direction:column;gap:14px;" onsubmit="return chk()">
        <div><label class="form-label">用户名</label><input type="text" name="username" required class="input-field" placeholder="3-20个字符"></div>
        <div><label class="form-label">密码</label><input type="password" id="pw" name="password" required class="input-field" placeholder="至少6个字符"></div>
        <div><label class="form-label">确认密码</label><input type="password" id="pw2" name="confirm_password" required class="input-field" placeholder="再次输入密码"></div>
        <div id="pw-err" style="display:none;background:var(--c-red-bg);border:1px solid rgba(239,68,68,0.2);color:var(--c-red);padding:10px 13px;border-radius:var(--r-md);font-size:13px;text-align:center;">两次密码不一致</div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;margin-top:4px;">立即注册</button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-2);">已有账号？ <a href="/login" style="color:var(--c-primary);font-weight:700;">去登录</a></p>
    </div>

    <p style="text-align:center;margin-top:16px;font-size:11px;color:var(--text-4);">注册即同意 <a href="#" style="color:var(--text-3);">服务条款</a> 与 <a href="#" style="color:var(--text-3);">隐私政策</a></p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
<script>function chk(){var ok=document.getElementById('pw').value===document.getElementById('pw2').value;document.getElementById('pw-err').style.display=ok?'none':'block';return ok;}</script>
</body></html>
