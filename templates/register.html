<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 心愈 AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
        .hero-gradient { background: radial-gradient(circle at 70% 30%, #f0fdfa 0%, #ffffff 100%); }
    </style>
</head>
<body class="bg-white text-slate-800 hero-gradient min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">
        <div class="flex items-center justify-center gap-2 mb-8 cursor-pointer" onclick="window.location.href='/'">
            <div class="w-12 h-12 bg-teal-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-teal-200">
                <span class="text-2xl">🌙</span>
            </div>
            <span class="text-2xl font-bold tracking-tight text-slate-800">心愈 AI</span>
        </div>

        <div class="bg-white/80 backdrop-blur-xl rounded-[2.5rem] p-10 shadow-2xl border border-white">
            <h1 class="text-3xl font-bold text-slate-900 mb-2 text-center">创建账号</h1>
            <p class="text-slate-500 text-center mb-8">加入我们，开始关注您的心理健康</p>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm mb-6 text-center font-medium">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="/register" method="POST" class="space-y-6" onsubmit="return validatePasswords()">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">用户名</label>
                    <input type="text" name="username" required 
                        class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-teal-500 focus:bg-white transition-all outline-none"
                        placeholder="请设置您的用户名">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">密码</label>
                    <input type="password" id="password" name="password" required 
                        class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-teal-500 focus:bg-white transition-all outline-none"
                        placeholder="请设置您的密码">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">确认密码</label>
                    <input type="password" id="confirm_password" name="confirm_password" required 
                        class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-teal-500 focus:bg-white transition-all outline-none"
                        placeholder="请再次输入您的密码">
                </div>
                <div id="password-error" class="hidden bg-red-50 text-red-600 p-4 rounded-xl text-sm text-center font-medium">
                    两次输入的密码不一致
                </div>
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-teal-100 hover:-translate-y-1">
                    立即注册
                </button>
            </form>

            <script>
                function validatePasswords() {
                    const pass = document.getElementById('password').value;
                    const confirmPass = document.getElementById('confirm_password').value;
                    const errorDiv = document.getElementById('password-error');
                    
                    if (pass !== confirmPass) {
                        errorDiv.classList.remove('hidden');
                        return false;
                    }
                    errorDiv.classList.add('hidden');
                    return true;
                }
            </script>

            <p class="text-center mt-8 text-slate-500 text-sm">
                已经有账号了？ 
                <a href="/login" class="text-teal-600 font-bold hover:underline">去登录</a>
            </p>
        </div>
    </div>
</body>
</html>
